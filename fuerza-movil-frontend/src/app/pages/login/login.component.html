<div style="max-width: 400px; margin: 80px auto; padding: 24px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>FuerzaMóvil - Iniciar Sesión</h2>

  <form (ngSubmit)="onLogin()">
    <div style="margin-bottom: 16px;">
      <label for="username">Usuario / Email</label>
      <input 
        type="text" 
        id="username" 
        [(ngModel)]="credentials.username" 
        name="username" 
        required 
        style="width: 100%; padding: 8px; margin-top: 4px;"
      />
    </div>

    <div style="margin-bottom: 16px;">
      <label for="password">Contraseña</label>
      <input 
        type="password" 
        id="password" 
        [(ngModel)]="credentials.password" 
        name="password" 
        required 
        style="width: 100%; padding: 8px; margin-top: 4px;"
      />
    </div>

    <div *ngIf="errorMessage" style="color: red; margin-bottom: 16px;">
      {{ errorMessage }}
    </div>

    <button 
      type="submit" 
      [disabled]="isLoading" 
      style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;"
    >
      {{ isLoading ? 'Ingresando...' : 'Iniciar Sesión' }}
    </button>
  </form>
</div>
