<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 440px; width: 100%;">

    <!-- ENCABEZADO TOYOTA PACHUCA -->
    <div class="card-header bg-black text-white p-4 text-center border-bottom border-danger border-4">
      <div class="d-flex flex-column align-items-center justify-content-center pt-2">
        <div class="brand-logo-container mb-3">
          <img src="assets/toyotaPachuca.svg" alt="Toyota Pachuca" class="img-fluid rounded-2 shadow-sm brand-logo-img"
            style="max-height: 60px;" />
        </div>

        <h1 class="h5 fw-bold text-uppercase tracking-wide mb-0 text-white brand-title" style="letter-spacing: 1px;">
          Toyota Pachuca
        </h1>
        <span class="small text-danger fw-semibold" style="font-size: 0.72rem; letter-spacing: 0.5px;">FUERZAMÓVIL COMERCIAL</span>
      </div>
    </div>

    <!-- CUERPO DEL FORMULARIO -->
    <div class="card-body p-4 p-md-5 bg-white">
      <h6 class="fw-bold text-dark mb-1 text-center fs-5">Iniciar Sesión</h6>
      <p class="text-muted small text-center mb-4">Ingresa tus credenciales institucionales de acceso</p>

      <form (ngSubmit)="onLogin()">

        <div class="mb-3">
          <label for="username" class="form-label small fw-bold text-dark">Usuario / Correo</label>
          <div class="input-group shadow-sm rounded-3 overflow-hidden border">
            <span class="input-group-text bg-light border-0 text-muted ps-3"><i class="bi bi-person-fill"></i></span>
            <input type="text" id="username" [(ngModel)]="credentials.username" name="username" required
              class="form-control border-0 shadow-none py-2 font-monospace" placeholder="ejemplo@toyotapachuca.com" />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small fw-bold text-dark">Contraseña</label>
          <div class="input-group shadow-sm rounded-3 overflow-hidden border">
            <span class="input-group-text bg-light border-0 text-muted ps-3"><i class="bi bi-lock-fill"></i></span>
            <input type="password" id="password" [(ngModel)]="credentials.password" name="password" required
              class="form-control border-0 shadow-none py-2" placeholder="••••••••" />
          </div>
        </div>

        <div *ngIf="errorMessage"
          class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 small rounded-3 mb-4">
          <i class="bi bi-exclamation-triangle-fill fs-6 text-danger"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <button type="submit" [disabled]="isLoading"
          class="btn btn-toyota w-100 py-2.5 fw-bold shadow-sm rounded-3 d-flex align-items-center justify-content-center gap-2">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>{{ isLoading ? 'Autenticando...' : 'Acceder al Sistema' }}</span>
        </button>
      </form>
    </div>

    <!-- PIE DE PÁGINA -->
    <div class="card-footer bg-light p-3 text-center border-0">
      <span class="text-muted small font-monospace" style="font-size: 0.75rem;">Sistemas Comerciales Toyota Pachuca &bull; v2.0</span>
    </div>

  </div>
</div>
